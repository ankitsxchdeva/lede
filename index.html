<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>lede</title>
  <meta name="description" content="A personal news digest: recent posts from a handful of feeds, refreshed every half hour.">
  <meta name="theme-color" content="#f5f4fa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1e1c22" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="reader.css">
</head>
<body>
  <div class="main-wrapper">
    <header class="masthead">
      <div class="masthead-left">
        <h1 class="wordmark">lede</h1>
        <nav class="tabs" aria-label="views">
          <button id="tab-today" class="tab active" aria-current="page">today</button>
          <button id="tab-saved" class="tab">saved</button>
        </nav>
      </div>
      <div class="search-wrapper">
        <label class="visually-hidden" for="search">filter items by keyword</label>
        <input id="search" type="search" placeholder="filter by keyword" autocomplete="off" spellcheck="false">
        <kbd class="search-kbd" aria-hidden="true">/</kbd>
      </div>
    </header>

    <p class="notice" id="notice" hidden></p>

    <main id="digest" class="board" aria-label="news digest"></main>

    <p class="empty-state" id="empty-state" hidden></p>
  </div>
  <script src="reader.js"></script>
</body>
</html>
