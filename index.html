<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>lede</title>
  <meta name="theme-color" content="#f5f4fa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1e1c22" media="(prefers-color-scheme: dark)">
  <!-- Instance config (this copy serves ankitsachdeva.com/lede). The image
       build strips both tags, so the container always derives: same-origin
       API, sections from feeds.yaml. Forks hosting the frontend separately
       point lede:api at their own backend. -->
  <meta name="lede:api" content="https://raspberrypi.tail9476fb.ts.net:10000/lede">
  <meta name="lede:sections" content="software, hardware, health, politics">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="reader.css">
</head>
<body>
  <div class="main-wrapper">
    <header class="masthead">
      <div class="masthead-left">
        <h1 class="wordmark">lede</h1>
        <nav class="tabs" aria-label="views">
          <button id="tab-today" class="tab active" aria-current="page">today</button>
          <button id="tab-week" class="tab">week</button>
          <button id="tab-saved" class="tab">saved</button>
        </nav>
        <button id="export-saved" class="tab" hidden title="download the saved list as a spreadsheet (CSV)">export</button>
      </div>
      <div class="masthead-right">
        <p class="clock" id="clock" aria-live="off"></p>
        <p class="dateline" id="dateline"></p>
        <div class="search-wrapper">
          <label class="visually-hidden" for="search">filter items, or press enter to search the web</label>
          <input id="search" type="search" autocomplete="off" spellcheck="false">
          <kbd class="search-kbd" aria-hidden="true">/</kbd>
        </div>
        <div class="settings-wrap">
          <button id="settings-btn" class="tab" aria-haspopup="dialog" aria-expanded="false" aria-controls="settings-panel">settings</button>
            <div class="settings-panel" id="settings-panel" role="dialog" aria-label="settings" hidden>
            <div class="setting-row">
              <label for="set-theme">theme</label>
              <select id="set-theme">
                <option value="system">system</option>
                <option value="light">light</option>
                <option value="dark">dark</option>
              </select>
            </div>
            <div class="setting-row">
              <label for="set-engine">web search</label>
              <select id="set-engine">
                <option value="duckduckgo">duckduckgo</option>
                <option value="google">google</option>
                <option value="bing">bing</option>
                <option value="kagi">kagi</option>
                <option value="brave">brave</option>
              </select>
            </div>
            <div class="setting-row">
              <label for="set-view">start on</label>
              <select id="set-view">
                <option value="today">today</option>
                <option value="week">week</option>
                <option value="saved">saved</option>
              </select>
            </div>
            <div class="setting-row">
              <label for="set-clock24">24-hour clock</label>
              <input type="checkbox" id="set-clock24">
            </div>
            <div class="setting-row">
              <label for="set-dateline">show date</label>
              <input type="checkbox" id="set-dateline">
            </div>
            <div class="setting-row">
              <label for="set-hideempty">hide empty sections</label>
              <input type="checkbox" id="set-hideempty">
            </div>
          <button id="set-clear" class="settings-clear">clear read history</button>
          <p class="settings-note">stored in this browser only</p>
          </div>
        </div>
      </div>
    </header>

    <p class="notice" id="notice" hidden></p>

    <div class="standfirst" id="themes-wrap" hidden>
      <span class="kicker">today's themes</span>
      <p class="lede-standfirst" id="themes"></p>
    </div>

    <main id="digest" class="board" aria-label="news digest">
      <section class="group skeleton" aria-hidden="true">
        <div class="sk-line sk-head"></div>
        <div class="sk-line"></div>
        <div class="sk-line sk-mid"></div>
        <div class="sk-line"></div>
        <div class="sk-line sk-short"></div>
      </section>
      <section class="group skeleton" aria-hidden="true">
        <div class="sk-line sk-head"></div>
        <div class="sk-line sk-mid"></div>
        <div class="sk-line"></div>
        <div class="sk-line sk-short"></div>
      </section>
      <section class="group skeleton" aria-hidden="true">
        <div class="sk-line sk-head"></div>
        <div class="sk-line"></div>
        <div class="sk-line sk-short"></div>
        <div class="sk-line sk-mid"></div>
      </section>
    </main>

    <p class="empty-state" id="empty-state" hidden></p>

    <footer class="colophon">
      <a href="https://github.com/ankitsxchdeva/lede">source on github</a>
    </footer>
  </div>
  <script src="reader.js"></script>
</body>
</html>
