name: backend

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - index.html
      - reader.js
      - reader.css
      - favicon.svg
      - fonts/**
      - .github/workflows/backend.yml
  # PRs run on every change, unfiltered: the branch protection on main
  # requires these checks, and a path-filtered PR would be unmergeable.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r backend/requirements.txt
      - run: python test_cluster.py
        working-directory: backend

  image:
    # Multi-arch (QEMU): amd64 for generic self-hosters, arm64 for the
    # publisher's Pi. Pushes ghcr.io/ankitsxchdeva/lede-backend:latest.
    # Build context is the repo root so the frontend ships in the image.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          # PRs prove the image builds; only main publishes.
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/ankitsxchdeva/lede-backend:latest
